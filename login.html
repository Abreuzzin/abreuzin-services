<body>
  <main class="auth-container">

    <header class="brand">
      <div class="brand-icon" aria-hidden="true">A</div>

      <div>
        <div class="brand-name">Abreuzin Services</div>
        <div class="brand-caption">Sua solução começa aqui</div>
      </div>
    </header>

    <h1>Bem-vindo de volta!</h1>

    <p>
      Entre na sua conta para acompanhar suas solicitações
      e acessar seus serviços.
    </p>

    <form id="formLogin" class="auth-form">
      <label for="email">
        E-mail

        <input
          id="email"
          type="email"
          name="email"
          required
          autocomplete="email"
          maxlength="254"
          placeholder="voce@exemplo.com"
        >
      </label>

      <label for="senha">
        Senha

        <input
          id="senha"
          type="password"
          name="senha"
          required
          autocomplete="current-password"
          placeholder="Digite sua senha"
        >
      </label>

      <button type="submit" id="botaoLogin">
        Entrar na minha conta
      </button>
    </form>

    <div
      id="mensagemLogin"
      class="auth-message"
      role="status"
      aria-live="polite"
    ></div>

    <div class="auth-footer">
      Ainda não tem conta?
      <a href="cadastro.html">Criar conta grátis</a>
    </div>

    <div class="auth-footer">
      <a href="index.html">← Voltar ao início</a>
    </div>

    <div class="security-note">
      Acesse sua conta com segurança.<br>
      Abreuzin Services © 2026
    </div>

  </main>

  <script>
    "use strict";

    const API_URL = "https://abreuzin-services.onrender.com";
    const CHAVE_TOKEN = "clienteToken";

    const form = document.getElementById("formLogin");
    const mensagem = document.getElementById("mensagemLogin");
    const botao = document.getElementById("botaoLogin");

    function mostrarMensagem(texto, tipo = "erro") {
      mensagem.textContent = texto;
      mensagem.dataset.tipo = tipo;
    }

    async function lerResposta(resposta) {
      const texto = await resposta.text();

      if (!texto) return {};

      try {
        return JSON.parse(texto);
      } catch {
        return { mensagem: texto };
      }
    }

    form.addEventListener("submit", async evento => {
      evento.preventDefault();

      mensagem.textContent = "";

      const dados = new FormData(form);

      const email = String(dados.get("email") || "")
        .trim()
        .toLowerCase();

      const senha = String(dados.get("senha") || "");

      if (!email || !senha) {
        mostrarMensagem("Preencha o e-mail e a senha.");
        return;
      }

      const textoOriginal = botao.textContent;

      botao.disabled = true;
      botao.textContent = "Verificando seus dados...";

      try {
        let resposta;

        try {
          resposta = await fetch(`${API_URL}/api/clientes/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({ email, senha })
          });
        } catch {
          throw new Error(
            "Não foi possível conectar ao servidor. Tente novamente."
          );
        }

        const resultado = await lerResposta(resposta);

        if (
          !resposta.ok ||
          resultado.sucesso !== true ||
          !resultado.token
        ) {
          throw new Error(
            resultado.mensagem ||
            resultado.erro ||
            "Não foi possível entrar. Confira seu e-mail e sua senha."
          );
        }

        try {
          sessionStorage.setItem(CHAVE_TOKEN, resultado.token);
        } catch {
          throw new Error(
            "Não foi possível salvar sua sessão neste navegador."
          );
        }

        mostrarMensagem(
          "Login realizado com sucesso! Abrindo sua área...",
          "sucesso"
        );

        botao.textContent = "Acesso confirmado";

        window.setTimeout(() => {
          window.location.replace("cliente.html");
        }, 500);

      } catch (erro) {
        console.error("Erro no login:", erro);

        mostrarMensagem(
          erro.message || "Ocorreu um erro ao tentar entrar."
        );

        botao.disabled = false;
        botao.textContent = textoOriginal;
      }
    });
  </script>
</body>
</html>
