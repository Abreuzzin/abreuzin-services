<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abreuzin Services | Administração</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginContainer {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            color: #cbd5e1;
        }

        .campo input {
            width: 100%;
            padding: 13px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            outline: none;
        }

        .campo input:focus {
            border-color: #38bdf8;
        }

        #btnLogin {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #btnLogin:hover {
            background: #1d4ed8;
        }

        #mensagemLogin {
            margin-top: 15px;
            text-align: center;
            color: #f87171;
        }

        /* =========================
           PAINEL
        ========================= */

        #painelContainer {
            display: none;
            padding: 30px;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        .topo h1 {
            font-size: 28px;
        }

        .botoes {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 11px 16px;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }

        .btn-atualizar {
            background: #2563eb;
        }

        .btn-sair {
            background: #dc2626;
        }

        .tabela-container {
            overflow-x: auto;
            background: #1e293b;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #334155;
            text-align: left;
        }

        th {
            background: #172033;
            color: #38bdf8;
        }

        td {
            color: #e2e8f0;
        }

        .sem-solicitacoes {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .carregando {
            text-align: center;
            padding: 40px;
            color: #38bdf8;
        }

        @media (max-width: 700px) {

            #painelContainer {
                padding: 15px;
            }

            .topo {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         LOGIN
    ========================= -->

    <div id="loginContainer">

        <div class="login-box">

            <h1>🔐 Administração</h1>

            <p>Abreuzin Services</p>

            <form id="formLogin">

                <div class="campo">

                    <label for="usuario">
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Digite o usuário"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite a senha"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="btnLogin"
                >
                    Entrar
                </button>

                <div id="mensagemLogin"></div>

            </form>

        </div>

    </div>


    <!-- =========================
         PAINEL ADMIN
    ========================= -->

    <div id="painelContainer">

        <div class="topo">

            <div>

                <h1>📋 Solicitações</h1>

                <p>
                    Painel administrativo
                </p>

            </div>

            <div class="botoes">

                <button
                    class="btn btn-atualizar"
                    onclick="carregarSolicitacoes()"
                >
                    🔄 Atualizar
                </button>

                <button
                    class="btn btn-sair"
                    onclick="sair()"
                >
                    🚪 Sair
                </button>

            </div>

        </div>


        <div class="tabela-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Nome</th>
                        <th>WhatsApp</th>
                        <th>Email</th>
                        <th>Serviço</th>
                        <th>Descrição</th>
                        <th>Orçamento</th>
                        <th>Prazo</th>
                        <th>Data</th>

                    </tr>

                </thead>

                <tbody id="listaSolicitacoes">

                    <tr>

                        <td
                            colspan="9"
                            class="carregando"
                        >
                            Carregando...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <script>

        const API =
            "https://abreuzin-services.onrender.com";

        const loginContainer =
            document.getElementById(
                "loginContainer"
            );

        const painelContainer =
            document.getElementById(
                "painelContainer"
            );

        const formLogin =
            document.getElementById(
                "formLogin"
            );

        const mensagemLogin =
            document.getElementById(
                "mensagemLogin"
            );

        const listaSolicitacoes =
            document.getElementById(
                "listaSolicitacoes"
            );


        // ==========================================
        // VERIFICAR LOGIN SALVO
        // ==========================================

        const token =
            localStorage.getItem(
                "adminToken"
            );

        if (token) {

            mostrarPainel();

        }


        // ==========================================
        // LOGIN
        // ==========================================

        formLogin.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const usuario =
                    document.getElementById(
                        "usuario"
                    ).value;

                const senha =
                    document.getElementById(
                        "senha"
                    ).value;

                mensagemLogin.textContent =
                    "Entrando...";

                try {

                    const resposta =
                        await fetch(
                            `${API}/api/admin/login`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    usuario,
                                    senha
                                })
                            }
                        );

                    const dados =
                        await resposta.json();

                    if (!resposta.ok) {

                        mensagemLogin.textContent =
                            dados.mensagem ||
                            "Usuário ou senha inválidos.";

                        return;

                    }

                    localStorage.setItem(
                        "adminToken",
                        dados.token
                    );

                    mensagemLogin.textContent = "";

                    mostrarPainel();

                } catch (erro) {

                    console.error(erro);

                    mensagemLogin.textContent =
                        "Não foi possível conectar ao servidor.";

                }

            }
        );


        // ==========================================
        // MOSTRAR PAINEL
        // ==========================================

        function mostrarPainel() {

            loginContainer.style.display =
                "none";

            painelContainer.style.display =
                "block";

            carregarSolicitacoes();

        }


        // ==========================================
        // BUSCAR SOLICITAÇÕES
        // ==========================================

        async function carregarSolicitacoes() {

            listaSolicitacoes.innerHTML = `
                <tr>
                    <td colspan="9" class="carregando">
                        🔄 Carregando solicitações...
                    </td>
                </tr>
            `;

            const token =
                localStorage.getItem(
                    "adminToken"
                );

            if (!token) {

                sair();

                return;

            }

            try {

                const resposta =
                    await fetch(
                        `${API}/api/solicitacoes`,
                        {
                            headers: {
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );

                if (
                    resposta.status === 401 ||
                    resposta.status === 403
                ) {

                    sair();

                    return;

                }

                const dados =
                    await resposta.json();

                listaSolicitacoes.innerHTML = "";

                if (
                    !dados.solicitacoes ||
                    dados.solicitacoes.length === 0
                ) {

                    listaSolicitacoes.innerHTML = `
                        <tr>
                            <td
                                colspan="9"
                                class="sem-solicitacoes"
                            >
                                📭 Nenhuma solicitação encontrada.
                            </td>
                        </tr>
                    `;

                    return;

                }

                dados.solicitacoes.forEach(
                    function (solicitacao) {

                        const linha =
                            document.createElement(
                                "tr"
                            );

                        linha.innerHTML = `

                            <td>
                                ${solicitacao.id ?? ""}
                            </td>

                            <td>
                                ${solicitacao.nome ?? ""}
                            </td>

                            <td>
                                ${solicitacao.whatsapp ?? ""}
                            </td>

                            <td>
                                ${solicitacao.email ?? ""}
                            </td>

                            <td>
                                ${solicitacao.servico ?? ""}
                            </td>

                            <td>
                                ${solicitacao.descricao ?? ""}
                            </td>

                            <td>
                                ${solicitacao.orcamento ?? ""}
                            </td>

                            <td>
                                ${solicitacao.prazo ?? ""}
                            </td>

                            <td>
                                ${
                                    solicitacao.criado_em
                                    ? new Date(
                                        solicitacao.criado_em
                                      ).toLocaleString(
                                        "pt-BR"
                                      )
                                    : ""
                                }
                            </td>

                        `;

                        listaSolicitacoes.appendChild(
                            linha
                        );

                    }
                );

            } catch (erro) {

                console.error(erro);

                listaSolicitacoes.innerHTML = `
                    <tr>
                        <td
                            colspan="9"
                            class="sem-solicitacoes"
                        >
                            ❌ Erro ao carregar solicitações.
                        </td>
                    </tr>
                `;

            }

        }


        // ==========================================
        // SAIR
        // ==========================================

        function sair() {

            localStorage.removeItem(
                "adminToken"
            );

            painelContainer.style.display =
                "none";

            loginContainer.style.display =
                "flex";

            document.getElementById(
                "usuario"
            ).value = "";

            document.getElementById(
                "senha"
            ).value = "";

        }


        // ==========================================
        // ATUALIZAÇÃO AUTOMÁTICA
        // ==========================================

        setInterval(
            function () {

                const token =
                    localStorage.getItem(
                        "adminToken"
                    );

                if (token) {

                    carregarSolicitacoes();

                }

            },
            10000
        );

    </script>

</body>

</html>
