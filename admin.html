<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Admin | Abreuzin Services</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: #fff;
            padding: 30px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #999;
            margin-bottom: 30px;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.85;
        }

        .status {
            margin-bottom: 20px;
            color: #aaa;
        }

        .tabela-container {
            overflow-x: auto;
            background: #171a21;
            border-radius: 12px;
            border: 1px solid #292d36;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #292d36;
        }

        th {
            background: #1d2129;
            color: #fff;
        }

        td {
            color: #ccc;
        }

        tr:hover td {
            background: #1c2028;
        }

        .vazio {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="topo">

            <div>
                <h1>📋 Painel de Solicitações</h1>

                <p class="subtitulo">
                    Abreuzin Services
                </p>
            </div>

            <button onclick="carregarSolicitacoes()">
                🔄 Atualizar
            </button>

        </div>

        <div class="status" id="status">
            Carregando solicitações...
        </div>

        <div class="tabela-container">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>WhatsApp</th>
                        <th>E-mail</th>
                        <th>Serviço</th>
                        <th>Descrição</th>
                        <th>Orçamento</th>
                        <th>Prazo</th>
                        <th>Data</th>
                    </tr>

                </thead>

                <tbody id="listaSolicitacoes">
                </tbody>

            </table>

        </div>

    </div>

    <script>

        const API_URL =
            "https://abreuzin-services.onrender.com/api/solicitacoes";


        async function carregarSolicitacoes() {

            const status =
                document.getElementById("status");

            const lista =
                document.getElementById("listaSolicitacoes");


            status.textContent =
                "⏳ Carregando...";


            try {

                const resposta =
                    await fetch(API_URL);


                const dados =
                    await resposta.json();


                if (!resposta.ok) {

                    throw new Error(
                        "Erro ao buscar solicitações"
                    );

                }


                lista.innerHTML = "";


                if (
                    !dados.solicitacoes ||
                    dados.solicitacoes.length === 0
                ) {

                    lista.innerHTML = `
                        <tr>
                            <td colspan="9" class="vazio">
                                Nenhuma solicitação recebida ainda.
                            </td>
                        </tr>
                    `;


                    status.textContent =
                        "Nenhuma solicitação encontrada.";

                    return;

                }


                dados.solicitacoes.forEach(
                    (solicitacao) => {

                        const linha =
                            document.createElement("tr");


                        const data =
                            solicitacao.criado_em
                                ? new Date(
                                    solicitacao.criado_em
                                ).toLocaleString(
                                    "pt-BR"
                                )
                                : "-";


                        linha.innerHTML = `

                            <td>
                                ${solicitacao.id ?? "-"}
                            </td>

                            <td>
                                ${solicitacao.nome ?? "-"}
                            </td>

                            <td>
                                ${solicitacao.whatsapp ?? "-"}
                            </td>

                            <td>
                                ${solicitacao.email ?? "-"}
                            </td>

                            <td>
                                ${solicitacao.servico ?? "-"}
                            </td>

                            <td>
                                ${solicitacao.descricao ?? "-"}
                            </td>

                            <td>
                                ${solicitacao.orcamento ?? "-"}
                            </td>

                            <td>
                                ${solicitacao.prazo ?? "-"}
                            </td>

                            <td>
                                ${data}
                            </td>

                        `;


                        lista.appendChild(linha);

                    }
                );


                status.textContent =
                    `✅ ${dados.solicitacoes.length} solicitação(ões) encontrada(s).`;

            }


            catch (erro) {

                console.error(erro);


                status.textContent =
                    "❌ Não foi possível carregar as solicitações.";

            }

        }


        carregarSolicitacoes();


        setInterval(
            carregarSolicitacoes,
            10000
        );

    </script>

</body>

</html>
