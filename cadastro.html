<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | Abreuzin Services</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      width: min(100% - 32px, 460px);
      margin: 50px auto;
      padding: 30px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 35px #00000012;
    }

    .auth-container h1 { margin-bottom: 8px; }
    .auth-container p { color: #666; margin-bottom: 24px; }

    .auth-form { display: grid; gap: 15px; }
    .auth-form label { display: grid; gap: 7px; font-weight: 600; }

    .auth-form input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d4d4d4;
      border-radius: 8px;
      font: inherit;
      box-sizing: border-box;
    }

    .auth-form button {
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-form button:disabled { opacity: .6; cursor: wait; }
    .auth-message { margin-top: 16px; font-weight: 600; }
    .auth-footer { margin-top: 20px; font-size: .95rem; }
    .auth-footer a { color: #2563eb; }
  </style>
</head>
<body>
  <main class="auth-container">
    <h1>Criar sua conta</h1>
    <p>Cadastre-se para acompanhar suas solicitações.</p>

    <form id="formCadastro" class="auth-form">
      <label>
        Nome completo
        <input type="text" name="nome" required maxlength="120"
               autocomplete="name" placeholder="Seu nome">
      </label>

      <label>
        E-mail
        <input type="email" name="email" required maxlength="255"
               autocomplete="email" placeholder="voce@exemplo.com">
      </label>

      <label>
        WhatsApp
        <input type="tel" name="whatsapp" maxlength="30"
               autocomplete="tel" placeholder="(85) 99999-9999">
      </label>

      <label>
        Senha
        <input type="password" name="senha" required minlength="8"
               autocomplete="new-password" placeholder="Mínimo de 8 caracteres">
      </label>

      <label>
        Confirmar senha
        <input type="password" name="confirmarSenha" required minlength="8"
               autocomplete="new-password" placeholder="Digite a senha novamente">
      </label>

      <button type="submit" id="botaoCadastro">Criar conta</button>
    </form>

    <div id="mensagemCadastro" class="auth-message" role="status"
         aria-live="polite"></div>

    <div class="auth-footer">
      Já tem uma conta? <a href="login.html">Entrar</a>
    </div>
    <div class="auth-footer">
      <a href="index.html">Voltar ao início</a>
    </div>
  </main>

  <script>
    const API_URL = "http://localhost:3000";

    const form = document.getElementById("formCadastro");
    const mensagem = document.getElementById("mensagemCadastro");
    const botao = document.getElementById("botaoCadastro");

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      mensagem.textContent = "";
      mensagem.style.color = "#b91c1c";

      const dados = new FormData(form);
      const nome = dados.get("nome").trim();
      const email = dados.get("email").trim().toLowerCase();
      const whatsapp = dados.get("whatsapp").trim();
      const senha = dados.get("senha");
      const confirmarSenha = dados.get("confirmarSenha");

      if (senha.length < 8) {
        mensagem.textContent = "A senha precisa ter pelo menos 8 caracteres.";
        return;
      }

      if (senha !== confirmarSenha) {
        mensagem.textContent = "As senhas não são iguais.";
        return;
      }

      botao.disabled = true;
      botao.textContent = "Criando conta...";

      try {
        const resposta = await fetch(`${API_URL}/api/clientes/cadastro`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nome, email, whatsapp, senha })
        });

        const resultado = await resposta.json();

        if (!resposta.ok || !resultado.sucesso) {
          throw new Error(resultado.mensagem || "Não foi possível criar a conta.");
        }

        mensagem.style.color = "#15803d";
        mensagem.textContent = "Conta criada com sucesso! Redirecionando para o login...";

        form.reset();

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);
      } catch (erro) {
        mensagem.textContent =
          erro.message === "Failed to fetch"
            ? "Não foi possível conectar ao servidor. Confira se a API está funcionando."
            : erro.message;
      } finally {
        botao.disabled = false;
        botao.textContent = "Criar conta";
      }
    });
  </script>
</body>
</html>
